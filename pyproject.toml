[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-qlora-assistant"
version = "2.0.0"
description = "LLaMA 3.2 3B QLoRA fine-tuning & chatbot for Srihari R's profile"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.28.0",
    "datasets>=2.18.0",
    "streamlit>=1.32.0",
]

[tool.setuptools]
py-modules = ["config", "utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001: blind except in user-facing CLI/UI error handling is intentional
ignore = ["BLE001"]